[importlinter]
root_package = app
include_external_packages = True

[importlinter:contract:architecture-spine]
name = Architecture spine — core < foundation < modules, later modules above earlier (PRD 10)
type = layers
layers =
    app.modules.m12_fleet
    app.modules.m11_voice
    app.modules.m10_community
    app.modules.m09_money
    app.modules.m08_intelligence
    app.modules.m07_fuel
    app.modules.m06_parking
    app.modules.m05_protection
    app.modules.m04_accessorial
    app.modules.m03_detention
    app.modules.m02_facility_intel
    app.modules.m01_map
    app.foundation.f01_identity | app.foundation.f02_facility | app.foundation.f03_location | app.foundation.f04_evidence | app.foundation.f05_load | app.foundation.f06_documents | app.foundation.f07_ledger | app.foundation.f08_notifications | app.foundation.f09_ai_gateway | app.foundation.f10_crowd | app.foundation.f11_map | app.foundation.f12_offline | app.foundation.f13_flags | app.foundation.f14_admin | app.foundation.f15_localization
    app.core

[importlinter:contract:core-is-independent]
name = Core imports nothing from foundation or modules (core/UI split)
type = forbidden
source_modules =
    app.core
forbidden_modules =
    app.foundation
    app.modules

[importlinter:contract:modules-use-foundation-public-only]
name = Modules reach foundation via .public only — never foundation internals
type = forbidden
source_modules =
    app.modules
forbidden_modules =
    app.foundation.f01_identity.domain
    app.foundation.f02_facility.domain
    app.foundation.f03_location.domain
    app.foundation.f04_evidence.domain
    app.foundation.f05_load.domain
    app.foundation.f06_documents.domain
    app.foundation.f07_ledger.domain
    app.foundation.f08_notifications.domain
    app.foundation.f09_ai_gateway.domain
    app.foundation.f10_crowd.domain
    app.foundation.f11_map.domain
    app.foundation.f12_offline.domain
    app.foundation.f13_flags.domain
    app.foundation.f14_admin.domain
    app.foundation.f15_localization.domain

[importlinter:contract:m01_map-domain-private]
name = m01_map internals are private — later modules use its .public only
type = forbidden
source_modules =
