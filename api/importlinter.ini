[importlinter]
root_package = app
include_external_packages = True

[importlinter:contract:architecture-spine]
name = Architecture spine — core < foundation < modules, later modules above earlier (PRD 10)
type = layers
layers =
    app.modules.m12_fleet
    app.modules.m11_voice
    app.modules.m10_community
    app.modules.m09_money
    app.modules.m08_intelligence
    app.modules.m07_fuel
    app.modules.m06_parking
    app.modules.m05_protection
    app.modules.m04_accessorial
    app.modules.m03_detention
    app.modules.m02_facility_intel
    app.modules.m01_map
    app.foundation
    app.core

[importlinter:contract:core-is-independent]
name = Core imports nothing from foundation or modules (core/UI split)
type = forbidden
source_modules =
    app.core
forbidden_modules =
    app.foundation
    app.modules

[importlinter:contract:modules-use-foundation-public-only]
name = Modules reach foundation via .public only — never foundation internals
type = forbidden
allow_indirect_imports = True
source_modules =
    app.modules
forbidden_modules =
    app.foundation.f01_identity.domain
    app.foundation.f02_facility.domain
    app.foundation.f03_location.domain
    app.foundation.f04_evidence.domain
