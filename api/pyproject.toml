[project]
name = "longhaul-api"
version = "0.1.0"
description = "LONGHAUL — consolidated trucker platform, FastAPI modular monolith"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    # AI-CONTEXT: multipart form parsing, for the image upload paths (api/uploads.py).
    # Pure Python and tiny — the driver app sends a photograph as bytes now rather than
    # as base64 in a JSON body, which inflated every capture by a third over the LTE of
    # a truck stop. FastAPI needs this to read a form at all.
    "python-multipart>=0.0.9",
    # AI-CONTEXT: image derivatives (f06_documents/domain/thumbnails.py). "Thumbnail" was
    # a variable name in two surfaces and never a file — both rendered the ORIGINAL into a
    # box a few dozen dp across, so opening a past load downloaded every full-size
    # photograph of every stop. Pillow is the only new runtime cost of fixing that; the
    # image size delta is recorded in the commit rather than guessed at.
    "pillow>=11.0",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "geoalchemy2>=0.16",
    "redis>=5.2",
    "minio>=7.2",
    "tzdata>=2024.2",
    # AI-CONTEXT: lat/lon -> IANA timezone, offline (audit F-14 + F-22). A facility's
    # LOCAL calendar decides how many nights a stay covers and whether a dwell was
    # overnight, and F2 carried no timezone at all — so both money questions were being
    # asked of UTC instants, refusing real layovers and undercharging lot owners west of
    # UTC. Chosen over a longitude approximation because DST and the Arizona/Indiana
    # exceptions are exactly where a US-only product breaks, and over a network lookup
    # because this must work in a dead zone. It is ~70 MB against an API image already at
    # 4.6 GB — the "keep the image light" argument that picked reportlab over WeasyPrint
    # was measured before deciding and no longer applies at this scale.
    "timezonefinder>=6.5",
    "pgvector>=0.3",
    # F4 evidence-pack rendering (design-prd §17). Pure-Python wheel: no system
    # libraries, so the image and CI stay light and dev=CI parity is trivial.
    # Chosen over WeasyPrint because F15 makes counterparty artifacts English-only,
    # which removes the complex-script shaping that would justify the heavier stack.
    "reportlab>=4.2",
    # AI-CONTEXT: Web Push (design-prd §13.1). The payload must be encrypted to the
    # subscription's own keys (aes128gcm, RFC 8291) and the request signed with a VAPID
    # JWT (RFC 8292) — neither is something to hand-roll for a channel that carries a
    # driver's money alerts. Chosen over an FCM/APNs SDK because VAPID needs no vendor
    # account: the keypair is self-generated, and Chrome/Edge/Firefox on Android — LAW
    # 0's target device — support it natively.
    "pywebpush>=2.0",
    # AI-CONTEXT: DECLARED, not inherited (M14 slice 1, owner decision 2026-08-15).
    #
    # It was already installed at 50.0.0 — but transitively, via `pywebpush` → `py-vapid`
    # → `http_ece`. M14 encrypts a fleet's pasted telematics key at rest with AES-GCM
    # because the nightly A12 backup ships this database offsite, and a security control
    # that rests on somebody else's dependency graph is one `pywebpush` bump from
    # vanishing with no failing test to say so. A transitive dependency is a fact about
    # today's lockfile; a declared one is a requirement.
    #
    # Zero image cost: the wheel is already in the image for Web Push.
    "cryptography>=44.0",
    # AI-CONTEXT: MOVED from `[dev]`, and it was load-bearing in production the whole
    # time (found while building M14's poller, 2026-08-15).
    #
    # `httpx` was declared only as a dev extra, on the reading that outbound HTTP belongs
    # to `make ingest-*` targets. That reading is false: the WORKER schedules
    # `tpims_dynamic` every 180 s and `eia_regional` weekly, and both reach
    # `facility.ingest.fetch_tpims` / `m7.fetch_eia`, which `import httpx` inside the
    # function. Production has it purely because the Dockerfile installs `.[dev]` — so a
    # decision to stop shipping dev extras, which is an ordinary hardening step, would
    # have silently killed the parking feed.
    #
    # M14's poller is the one that made this worth fixing rather than noting: it is a
    # scheduled outbound call on the path to an invoice. Zero image change; the wheel is
    # already installed.
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "import-linter>=2.1",
    "ruff>=0.8",
    # httpx moved to the runtime dependencies above — the worker's scheduled ingest jobs
    # use it in production, not only the make targets.
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# AI-CONTEXT: FastAPI's Depends/Query/Header/Path in argument defaults is the
# framework's intended pattern; mark them immutable so B008 stops flagging it.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Path",
]
