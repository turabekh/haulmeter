[project]
name = "longhaul-api"
version = "0.1.0"
description = "LONGHAUL — consolidated trucker platform, FastAPI modular monolith"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "geoalchemy2>=0.16",
    "redis>=5.2",
    "minio>=7.2",
    "tzdata>=2024.2",
    "pgvector>=0.3",
    # F4 evidence-pack rendering (design-prd §17). Pure-Python wheel: no system
    # libraries, so the image and CI stay light and dev=CI parity is trivial.
    # Chosen over WeasyPrint because F15 makes counterparty artifacts English-only,
    # which removes the complex-script shaping that would justify the heavier stack.
    "reportlab>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "import-linter>=2.1",
    "ruff>=0.8",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# AI-CONTEXT: FastAPI's Depends/Query/Header/Path in argument defaults is the
# framework's intended pattern; mark them immutable so B008 stops flagging it.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Path",
]
