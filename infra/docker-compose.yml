name: ${COMPOSE_PROJECT_NAME:-longhaul}

services:
  postgres:
    build:
      context: ./postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: ["postgres", "-p", "${POSTGRES_PORT}"]
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -p ${POSTGRES_PORT}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--port", "${REDIS_PORT}"]
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${REDIS_PORT}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--address", ":${MINIO_API_PORT}", "--console-address", ":${MINIO_CONSOLE_PORT}"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT}:${MINIO_API_PORT}"
      - "${MINIO_CONSOLE_PORT}:${MINIO_CONSOLE_PORT}"
    volumes:
      - miniodata:/data

  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_SMTP_BIND_ADDR: "0.0.0.0:${MAILPIT_SMTP_PORT}"
      MP_UI_BIND_ADDR: "0.0.0.0:${MAILPIT_UI_PORT}"
    ports:
      - "${MAILPIT_SMTP_PORT}:${MAILPIT_SMTP_PORT}"
      - "${MAILPIT_UI_PORT}:${MAILPIT_UI_PORT}"

  # AI-CONTEXT: the migration is its own STEP, and it exists because of N-03.
  #
  # It used to ride inside the api's command — `alembic upgrade head && uvicorn` — and the
  # worker waited only on postgres being healthy. So on any deploy carrying a migration the
  # worker booted against the OLD schema and every one of its seven jobs failed:
  #
  #     worker: detention_clock failed (1x): column feature_flag.default_on does not exist
  #     worker: outbound_retry  failed (1x): relation "f14.job_schedule" does not exist
  #
  # Observed on the 113→121 deploy, `detention_clock` included — M3's P0, the alert that
  # free time expired. It self-healed on the failure backoff, but that backoff is up to
  # 3600 s for four jobs, so every migration-carrying deploy quietly cost the wedge feature
  # its clock and the ingest jobs an hour.
  #
  # A one-shot service rather than a healthcheck on the api, for two reasons. The dependency
  # is on the SCHEMA, and saying so directly beats "wait until the api answers /health and
  # know that its command happens to migrate first" — the implicit kind of coupling this
  # file's own comments keep having to explain. And with two consumers declaring the same
  # wait, neither can be given a new sibling that forgets it.
  #
  # The LOCAL stack carries it too, because the race is identical here and CLAUDE.md's
  # "dev = CI parity" rule means the ordering a deploy relies on has to be the ordering
  # `make up` exercises. This is also the cheaper place to find out it is wrong.
  #
  # `restart: "no"` is load-bearing: a one-shot with the stack's `unless-stopped` policy
  # would re-run alembic in a loop forever. `service_completed_successfully` means a FAILED
  # migration now stops the api and the worker together instead of leaving the worker up and
  # erroring — which is the honest outcome, because a half-applied schema is not a state
  # either of them should serve from.
  migrate:
    build:
      context: ../api
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    # AI-CONTEXT: the SAME mount api and worker carry, and its absence broke the stack
    # (finding N-04, the sequel to N-03).
    #
    # N-03 made the migration its own service so the worker could not boot against a
    # pre-migration schema. In dev, api and worker run the MOUNTED tree while this ran
    # the migrations BAKED INTO THE IMAGE — so a migration written after the last build
    # was invisible here and silently did not apply, and the api served new code against
    # an old schema. Worse on the second turn: once the database is stamped at a revision
    # the image does not carry, `alembic upgrade head` fails with "Can't locate revision",
    # and because api and worker wait on `service_completed_successfully`, NEITHER CAN
    # START. One unbuilt migration takes the whole dev stack down.
    #
    # 121's N-03 proof could not have caught this: it downgraded and re-applied a
    # migration that was already in the image. Only a NEWLY WRITTEN one reaches the bug.
    #
    # Deliberately dev-only. `docker-compose.deploy.yml` mounts no source anywhere — the
    # image IS the code there, built at deploy time — so migrate reading the image is
    # correct in production and would be wrong here.
    volumes:
      - ../api:/app
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ../api
    env_file:
      - .env
    environment:
      # AI-CONTEXT: MinIO credentials come from infra/.env, the same place the minio
      # service reads them. They were absent here, so the API fell back to its own
      # defaults — whose secret key did not match MINIO_ROOT_PASSWORD, so every
      # connection failed with SignatureDoesNotMatch and object storage silently
      # became an in-process dict.
      MINIO_ENDPOINT: "minio:${MINIO_API_PORT}"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    command: ["sh", "-c", "uvicorn app.main:app --host 0.0.0.0 --port ${API_PORT} --reload"]
    ports:
      - "${API_PORT}:${API_PORT}"
    volumes:
      - ../api:/app
      # AI-CONTEXT: read-only, and only so a test can assert the `osm-extract` recipe
      # still renders its tag list from the ingest rules instead of keeping its own
      # copy. That copy existed and drifted until six service rules were starved. The
      # alternative was a test that skips when the file is absent, and a check that
      # skips is a check that reports nothing while looking green.
      - ../Makefile:/repo/Makefile:ro
      # AI-CONTEXT: read-only, and for the same reason as the Makefile above — audit
      # U-03. The ~45 dynamic `t(`ns.${...}`)` families assemble their keys from
      # vocabularies that live in PYTHON, so the JS completeness test cannot enumerate
      # them: it proves the six catalogues agree with each other, which six identical
      # holes also satisfy. `test_dynamic_key_families.py` reads these files from the
      # side that owns the vocabulary. It FAILS rather than skips when the mount is
      # absent — a check that skips is a check that reports nothing while looking green.
      - ../ui/src/core/i18n:/repo/ui-i18n:ro
      # AI-CONTEXT: the two compose files, read-only, so `test_compose_migration_order.py`
      # can assert the N-03 ordering from the side that owns it. Same reasoning as the
      # Makefile and i18n mounts above, and the same rule: the test FAILS rather than skips
      # when the mount is absent.
      #
      # The FILES are mounted individually rather than the `infra/` directory, deliberately:
      # `infra/.env` lives there and carries the live Gmail credential. The api already
      # receives those values via `env_file`, but there is no reason to also hand a test
      # container the file (rule 9).
      - ./docker-compose.yml:/repo/infra/docker-compose.yml:ro
      - ./docker-compose.deploy.yml:/repo/infra/docker-compose.deploy.yml:ro
      # AI-CONTEXT: the EDGE config, for `test_broker_link_is_reachable.py`. The routing it
      # holds is invisible from the application — every test in this suite talks to the
      # router directly, where a missing proxy route cannot be seen — and a link that never
      # reaches the API is precisely the defect that test exists for: `/pack/s/<token>` was
      # answered by the SPA, so every broker following a link from a counterparty email got
      # the driver app's sign-in screen. Mounted read-only, like the compose files beside it.
      - ./Caddyfile:/repo/infra/Caddyfile:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ../api
    env_file:
      - .env
    environment:
      # AI-CONTEXT: MinIO credentials come from infra/.env, the same place the minio
      # service reads them. They were absent here, so the API fell back to its own
      # defaults — whose secret key did not match MINIO_ROOT_PASSWORD, so every
      # connection failed with SignatureDoesNotMatch and object storage silently
      # became an in-process dict.
      MINIO_ENDPOINT: "minio:${MINIO_API_PORT}"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    command: ["python", "-m", "app.worker"]
    volumes:
      - ../api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # N-03: the worker queries the schema the migration writes — see `migrate` above
      migrate:
        condition: service_completed_successfully

  ui:
    build:
      context: ../ui
      dockerfile: Dockerfile.dev
    # Vite exposes VITE_-prefixed vars to the app; MAPBOX_TOKEN (public pk.* token)
    # lives in the gitignored infra/.env, never in the repo. Empty -> tiles fall
    # back to the placeholder canvas (M1 activation seam).
    environment:
      VITE_MAPBOX_TOKEN: ${MAPBOX_TOKEN:-}
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "${UI_PORT}"]
    ports:
      - "${UI_PORT}:${UI_PORT}"
    volumes:
      - ../ui:/app
      - /app/node_modules
      # AI-CONTEXT: the layout harness's browser. Without this it lives in the
      # container's filesystem and `make down` throws it away, so `make ui-layout`
      # re-downloads 111 MB on the next run — found the first time the stack was
      # restarted after the harness landed.
      - playwright:/root/.cache/ms-playwright

volumes:
  pgdata:
  miniodata:
  playwright:
